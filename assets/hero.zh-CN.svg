<text x="1000" y="458" text-anchor="middle" fill="#244A42" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16">先找到一步，再把上下文补清楚。</text>
<text x="1216" y="592" text-anchor="end" fill="#69766D" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14">受角色启发的独立 Skill</text>
