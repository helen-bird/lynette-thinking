<title id="title">Lynette Thinking — What would Lynette do?</title>
<desc id="desc">What would Lynette do? 借 Lynette 的视角，把下一步想清楚。职场、家庭与朋友关系。</desc>
<rect width="1280" height="640" rx="24" fill="#F5F2EA"/>
<path d="M32 92H1248M32 548H1248" stroke="#D7D9CC"/>
<text x="64" y="59" fill="#244A42" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" letter-spacing="3">一种用得上的思考方式</text>
<text x="1216" y="59" text-anchor="end" fill="#6A776E" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" letter-spacing="2">职场 / 家庭 / 朋友</text>
<text x="60" y="220" fill="#244A42" font-family="Georgia, serif" font-size="89" letter-spacing="-3">Lynette</text>
<text x="60" y="315" fill="#244A42" font-family="Georgia, serif" font-size="89" letter-spacing="-3">Thinking</text>
<text x="64" y="383" fill="#9A5B2C" font-family="Georgia, serif" font-size="38" font-style="italic">What would Lynette do?</text>
<text x="66" y="431" fill="#244A42" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="26">把下一步想清楚。</text>
<text x="66" y="470" fill="#69766D" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19">看清真实条件，找到可用的帮助。</text>
<text x="66" y="499" fill="#69766D" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19">想清楚怎么做，也知道怎么开口。</text>
